; VegasCraft: Fallout: New Vegas with Minecraft physics, inventory, blocks and combat.
; Goes in Data\NVSE\Plugins\ next to VegasCraft.dll.

[Minecraft]
; Start Minecraft when New Vegas starts. It stays hidden (no window, no music), opens its
; VegasCraft world by itself once you're in game, and quits when New Vegas closes.
; 0 = start Minecraft yourself (any launcher, the VegasCraft instance).
bStartWithNewVegas=1
; Empty: the Minecraft that comes with VegasCraft (a portable Prism Launcher, unpacked to
; %LOCALAPPDATA%\VegasCraft; the first time it asks you to sign in with your Microsoft account).
; Or the full path of your own launcher (Prism, MultiMC, or a .bat file).
sLauncher=
; What to pass to your own launcher. For Prism: --launch and the instance's folder name.
sArguments=--launch VegasCraft

[World]
; Describe the ground under Minecraft's chunks to Minecraft, which grows its overworld features
; (trees, plants, structures) and mobs on it. 0 = off.
bExportLand=1

[Development]
; Reload VegasCraft\VegasCraftCore.dll as soon as a new build replaces it, without restarting
; New Vegas. 0 = off.
bHotReload=1

[Bridge]
; Shared memory name; change only to run a second, separate New Vegas.
MappingName=Local\VegasCraft_v1
